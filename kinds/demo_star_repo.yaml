id: demo_star_repo
title: Star the private-desk GitHub repo
description: Optional mutating encore. Needs a logged-in GitHub session. Hosted Holo; screenshots go to H Company.
risk: mutating
inference: hosted
may_need_you: true
runner: holo
requires_artifacts: false
max_steps: 30
max_time_s: 300
url_allowlist:
  - https://github.com/
denied_actions:
  - transfer
  - pay
  - send_money
params:
  type: object
  additionalProperties: false
  properties: {}
confirm_token: starred
launch_url: "{repo_url}"
launch_isolated: true
artifacts:
  dir_template: "{artifact_root}/{date}/{kind}"
prompt: |
  {browser} was just opened to {repo_url}. Do not hunt for the app.
  Do not use Spotlight, Launchpad, Terminal, Cursor, Cmd+Tab, or Mission Control.
  If a login wall appears, do not type passwords or codes. Reply with exactly:
  NEEDS_YOU: needs_login
  Then wait.
  If 2FA or captcha appears, reply with exactly:
  NEEDS_YOU: mfa_required
  Then wait.
  If already logged in, click Star on this repository if it is not already starred.
  Do not fork, do not open settings, do not type secrets.
  When the repo is starred (or already starred), reply with a single line:
  DONE: starred
  Then exit.
  Do not reply DONE if the star action did not complete.
